tasks:
  - id: jp-consumption-tax.classify
    title: Classify consumption tax
    summary: Inspect explicit tax settings and journal classifications. Tax-excluded postings use net amounts; tax-included postings use gross amounts.
    target: journal
    fields: [book.consumption_tax, book.consumption_tax.status, book.consumption_tax.method, book.consumption_tax.accounting, book.consumption_tax.business_class, journal.lines]
    rules: [tax.settings, tax.status-required, tax.block-type, tax.invoice-type, tax.category-required, tax.category-unknown, tax.export-rate-zero, tax.rate-required, tax.rate-unknown, tax.rate-positive, tax.rate-not-allowed, tax.business-class-required]
    guide: jp-consumption-tax.classification
    examples: ["tests/classification.yaml#classified purchase", "tests/classification.yaml#missing tax status", "tests/classification.yaml#unknown category"]
    coverage: [Recorded tax blocks, category and rate vocabulary, simplified business class and net-line tax amount proposals. Untagged lines are not classified automatically.]
    judgment: [Confirm tax status, election, transaction category, invoice evidence, rounding and amount basis. Package selection establishes none of these facts.]
  - id: jp-consumption-tax.filing
    title: Prepare consumption-tax calculation figures
    summary: Inspect the supported scope, then preview general or simplified figures with an explicit scope confirmation.
    target: book
    fields: [book.consumption_tax, book.consumption_tax.status, book.consumption_tax.method, book.consumption_tax.accounting, book.currency, book.scale]
    operations: [{kind: recipe, id: jp-consumption-tax.shouhizei-general}, {kind: recipe, id: jp-consumption-tax.shouhizei-simplified}]
    guide: jp-consumption-tax.filing
    examples: ["tests/filings.yaml#本則課税 — 経過措置 splits at 2026-10-01", "tests/coverage.yaml#scope confirmation required"]
    coverage: [Posted classified lines at 10% and 8%; dated non-invoice transition; general full-deduction and simplified arithmetic aids.]
    judgment: [Confirm the guide's coverage and inputs before invocation. Returns, filing submission, special schemes, partial deduction and named financial-view approval remain outside these recipes.]
