fields:
  book.jp_rsu:
    type: map
    description:
      en: Confirm the resident employee self-assessment profile, dedicated income_account/share_account and share_unit. Salary-statement inclusion and Japanese withholding must both be false.
      ja: 日本に居住・勤務する従業員が確定申告で納税する場合であることを確認し、専用のincome_account・share_account・share_unitを指定します。源泉徴収票への算入（included_in_salary_statement）と日本の源泉徴収（japan_withholding）は、どちらもfalseにします。
  line.jp_rsu:
    type: map
    description:
      en: Put identical event_id, grant_id, payer, recognition_date, valuation_source and either a reviewed positive integer gross_jpy or complete exact valuation inputs on both vesting lines. Valuation inputs use the vesting-value recipe format; any recorded gross_jpy must agree with them. Keep the original price/FX evidence.
      ja: 権利確定の両明細に同じevent_id・grant_id・payer・recognition_date・valuation_sourceと、確認済みの正の整数gross_jpy、またはすべてそろったvaluation入力を記録します。valuationはvesting-valueと同じ形式で、gross_jpyも記録する場合は計算結果に一致させます。株価と為替の原資料を保存します。
