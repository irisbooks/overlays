book:
  schema_version: 1
  region: "JP"
  currency: "JPY"
  scale: 0
  fiscal_year: 2026
  fiscal_start_month: 1
  units: [{"symbol": "AMZN", "scale": 0}]
  jp_rsu: {"scope_confirmed": true, "included_in_salary_statement": false, "japan_withholding": false, "tax_funding": "self-assessment", "income_account": "Income:RSU", "share_account": "Assets:AMZN", "share_unit": "AMZN"}
cases:
  - name: "exact price and FX with final truncation"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 100, "price_coefficient": 10025, "price_scale": 2, "fx_coefficient": 1501250, "fx_scale": 4, "rounding": "truncate"}
    figures: {"gross_jpy": 1505003, "unrounded_floor_jpy": 1505003, "fraction_numerator": 125000, "fraction_denominator": 1000000}
  - name: "explicit half-up"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 100, "price_coefficient": 10025, "price_scale": 2, "fx_coefficient": 1501250, "fx_scale": 4, "rounding": "half-up"}
    figures: {"gross_jpy": 1505003, "unrounded_floor_jpy": 1505003, "fraction_numerator": 125000, "fraction_denominator": 1000000}
  - name: "price fraction survives until FX conversion"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1, "price_coefficient": 5, "price_scale": 1, "fx_coefficient": 2, "fx_scale": 0, "rounding": "truncate"}
    figures: {"gross_jpy": 1, "unrounded_floor_jpy": 1, "fraction_numerator": 0, "fraction_denominator": 10}
  - name: "half yen truncates"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1, "price_coefficient": 5, "price_scale": 1, "fx_coefficient": 1, "fx_scale": 0, "rounding": "truncate"}
    error: "rounds to zero"
  - name: "half yen rounds up"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1, "price_coefficient": 5, "price_scale": 1, "fx_coefficient": 1, "fx_scale": 0, "rounding": "half-up"}
    figures: {"gross_jpy": 1, "unrounded_floor_jpy": 0, "fraction_numerator": 5, "fraction_denominator": 10}
  - name: "below half stays zero"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1, "price_coefficient": 49, "price_scale": 2, "fx_coefficient": 1, "fx_scale": 0, "rounding": "half-up"}
    error: "rounds to zero"
  - name: "above half rounds once at the end"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1, "price_coefficient": 49, "price_scale": 2, "fx_coefficient": 2, "fx_scale": 0, "rounding": "half-up"}
    figures: {"gross_jpy": 1, "unrounded_floor_jpy": 0, "fraction_numerator": 98, "fraction_denominator": 100}
  - name: "raw multiplication overflows int64 but exact result fits"
    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1000000, "price_coefficient": 99999999999999, "price_scale": 8, "fx_coefficient": 99999999999999, "fx_scale": 8, "rounding": "truncate"}
    figures: {"gross_jpy": 999999999999980000, "unrounded_floor_jpy": 999999999999980000, "fraction_numerator": 1000000, "fraction_denominator": 10000000000000000}
