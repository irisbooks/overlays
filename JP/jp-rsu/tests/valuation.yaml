    recipe:
      id: "jp-rsu.vesting-value"
      params: {"scope_confirmed": true, "quantity": 1000000, "price_coefficient": 100000000000000, "price_scale": 8, "fx_coefficient": 100000000000000, "fx_scale": 8, "rounding": "truncate"}
    figures: {"gross_jpy": 1000000000000000000, "unrounded_floor_jpy": 1000000000000000000, "fraction_numerator": 0, "fraction_denominator": 10000000000000000}
