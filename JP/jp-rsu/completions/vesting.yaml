id: journal.balance
call: balance
when: >-
  !journal.lines.exists(l, l.unit != '' && l.side == 'credit')
  && (!journal.lines.exists(l, has(l.jp_rsu)) || rsu_scope(book))
description:
  en: Fill the salary credit from an already recorded JPY share debit. Calculate the gross value with jp-rsu.vesting-value or supply a reviewed value first. Ordinary monetary journals retain balancing; no price, FX, cash, withholding or sale is calculated.
  ja: jp-rsu.vesting-valueなどで計算・確認した円建て株式取得額から給与の貸方金額を補完します。通常の金額仕訳の貸借補完も継続します。株価・為替による評価、現金、源泉徴収、売却の計算は行いません。
