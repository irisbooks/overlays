rules:
  - id: rsu.scope
    target: journal
    severity: error
    when: "journal.lines.exists(l, has(l.jp_rsu))"
    assert: rsu_scope(book)
    message:
      en: Confirm Japan-resident employee scope, salary-statement exclusion, no Japanese withholding, self-assessment and dedicated salary/share accounts before using RSU records.
      ja: RSUの記録を使う前に、日本に居住・勤務する従業員であること、国内の源泉徴収票に含まれないこと、日本で源泉徴収されないこと、確定申告で納税すること、給与と株式の専用科目を確認してください。
  - id: rsu.valuation
    target: journal
    severity: error
    when: >-
      rsu_scope(book) && (journal.lines.exists(l, has(l.jp_rsu))
        || journal.lines.exists(l, l.account == book.jp_rsu.income_account))
    assert: rsu_journal_valid(book, journal)
    message:
      en: Record one share debit and equal gross-salary credit with identical event/grant/payer/date, a reviewed positive gross_jpy or complete exact valuation inputs, and valuation_source evidence. Confirm the valuation facts; no tax sale or withholding is inferred.
      ja: 株式の借方と、同額の給与の貸方に、同じevent_id・grant_id・payer・recognition_date・valuation_sourceを記録してください。金額は、確認済みの正のgross_jpyか、すべてそろったvaluation入力で示します。評価の根拠を確認してください。納税のための売却や源泉徴収は推定しません。
  - id: rsu.calculation
    target: journal
    severity: error
    when: >-
      rsu_scope(book) && journal.lines.exists(l,
        has(l.jp_rsu) && type(l.jp_rsu) == map && has(l.jp_rsu.valuation))
    assert: rsu_calculation_valid(book, journal)
    message:
      en: Recorded RSU valuation inputs must be complete, within supported bounds and identical on both lines; use whole shares with Book unit scale 0. The Overlay-calculated JPY amount must match the postings and any recorded gross_jpy. Choose truncation or half-up explicitly.
      ja: valuation入力は、両明細に同じ内容で、対応範囲内の値と整数株数ですべて記録してください。株式の単位は帳簿でscale 0にします。パッケージが計算した円換算額は仕訳金額と一致させ、gross_jpyも記録する場合はそれとも一致させてください。roundingには切り捨て（truncate）か四捨五入（half-up）を明示します。
