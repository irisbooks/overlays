rules:
  - id: currency.scope
    target: journal
    when: has(book.jp_foreign_currency)
    assert: currency_scope(book)
    message:
      en: Confirm ordinary USD cash, complete ownership scope and moving-average methodology; securities and margin FX use different policies.
      ja: 通常の米ドル現預金、本人名義の対象口座全体、移動平均による計算方法を確認してください。株式や証拠金FXは別の規則で扱います。
  - id: currency.disposal-scope
    target: journal
    when: has(book.jp_foreign_currency) && journal.lines.exists(l, l.side == 'credit' && l.unit != '' && l.account in book.jp_foreign_currency.accounts)
    assert: currency_journal_scope(book.jp_foreign_currency, journal)
    message:
      en: Disposal accounts must fit the explicitly mapped inventory, settlement, fees and gain scope.
      ja: 譲渡仕訳は、明示した在庫・決済・手数料・損益の科目だけで構成してください。
  - id: currency.source-scope
    target: journal
    when: >-
      has(book.jp_foreign_currency) && has(book.jp_foreign_currency.accounts)
      && has(book.jp_foreign_currency.currencies)
      && journal.lines.exists(l, l.account in book.jp_foreign_currency.accounts)
    assert: >-
      currency_source_scope({'inventory_accounts': book.jp_foreign_currency.accounts,
        'commodities': book.jp_foreign_currency.currencies}, journal)
    message:
      en: Holding movements require a supported unit and positive quantity; record paired own-account transfers separately from acquisitions and disposals.
      ja: 保有口座の増減には対応する単位と正の数量を記録してください。本人名義口座間の移動は両明細を対応付け、取得・譲渡とは別仕訳にしてください。
