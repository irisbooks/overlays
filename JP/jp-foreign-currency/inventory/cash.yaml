id: cash
when: currency_scope(book) && currency_mapping_valid(book.jp_foreign_currency)
with: >-
  {'method': 'moving-average', 'round_up': false, 'pool_accounts': true,
   'accounts': book.jp_foreign_currency.accounts, 'commodities': book.jp_foreign_currency.currencies,
   'facts': {'commodities': book.jp_foreign_currency.currencies, 'inventory_accounts': book.jp_foreign_currency.accounts, 'settlement_accounts': book.jp_foreign_currency.settlement_accounts,
   'fee_accounts': book.jp_foreign_currency.fee_accounts, 'gain_account': book.jp_foreign_currency.gain_account}}
