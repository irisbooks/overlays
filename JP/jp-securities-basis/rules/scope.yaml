rules:
  - id: securities-basis.scope
    target: journal
    when: has(book.jp_securities_basis)
    assert: securities_scope(book)
    message:
      en: Confirm JP individual ordinary listed shares, JPY scale 0, calendar year and capitalized acquisition costs before using this policy.
      ja: 個人の通常の上場株式、JPY・scale 0、暦年、取得時費用の資産計上を確認してから適用してください。
  - id: securities.disposal-scope
    target: journal
    when: has(book.jp_securities_basis) && journal.lines.exists(l, l.side == 'credit' && l.unit != '' && l.account in book.jp_securities_basis.accounts)
    assert: securities_journal_scope(book.jp_securities_basis, journal)
    message:
      en: Disposal accounts must fit the explicitly mapped inventory, settlement, fees and gain scope.
      ja: 譲渡仕訳は、明示した在庫・決済・手数料・損益の科目だけで構成してください。
  - id: securities.source-scope
    target: journal
    when: >-
      has(book.jp_securities_basis) && has(book.jp_securities_basis.accounts)
      && has(book.jp_securities_basis.commodities)
      && journal.lines.exists(l, l.account in book.jp_securities_basis.accounts)
    assert: >-
      securities_source_scope({'inventory_accounts': book.jp_securities_basis.accounts,
        'commodities': book.jp_securities_basis.commodities}, journal)
    message:
      en: Holding movements require a supported unit and positive quantity; record paired own-account transfers separately from acquisitions and disposals.
      ja: 保有口座の増減には対応する単位と正の数量を記録してください。本人名義口座間の移動は両明細を対応付け、取得・譲渡とは別仕訳にしてください。
