id: shares
when: securities_scope(book) && securities_mapping_valid(book.jp_securities_basis)
with: >-
  {'method': 'unit-average', 'round_up': true, 'pool_accounts': true,
   'accounts': book.jp_securities_basis.accounts,
   'commodities': book.jp_securities_basis.commodities,
   'facts': {'commodities': book.jp_securities_basis.commodities, 'inventory_accounts': book.jp_securities_basis.accounts, 'settlement_accounts': book.jp_securities_basis.settlement_accounts,
   'fee_accounts': book.jp_securities_basis.fee_accounts,
   'gain_account': book.jp_securities_basis.gain_account}}
