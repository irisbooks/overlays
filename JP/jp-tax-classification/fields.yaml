fields:
  book.consumption_tax:
    type: map
    description:
      en: Confirmed consumption-tax settings; missing settings leave status undetermined.
      ja: 確認済みの消費税設定です。省略した場合は課税・免税の区分が未確認のままです。
  book.consumption_tax.status:
    type: string
    when: has(book.consumption_tax) && type(book.consumption_tax) == map
    required: true
    description:
      en: Confirmed taxable or exempt status.
      ja: 確認済みの課税事業者・免税事業者の区分です。
    enum:
      - {value: taxable, label: {en: Taxable, ja: 課税事業者}}
      - {value: exempt, label: {en: Exempt, ja: 免税事業者}}
  book.consumption_tax.method:
    type: string
    when: manages_tax(book)
    required: true
    description:
      en: Confirmed general or simplified taxation method.
      ja: 確認済みの課税方式です。
    enum:
      - {value: general, label: {en: General taxation, ja: 本則課税}}
      - {value: simplified, label: {en: Simplified taxation, ja: 簡易課税}}
  book.consumption_tax.accounting:
    type: string
    when: manages_tax(book)
    required: true
    description:
      en: Whether recorded journal amounts include consumption tax.
      ja: 仕訳の金額を税込・税抜のどちらで記録するかを指定します。
    enum:
      - {value: tax_included, label: {en: Tax-inclusive, ja: 税込経理}}
      - {value: tax_excluded, label: {en: Tax-exclusive, ja: 税抜経理}}
  book.consumption_tax.business_class:
    type: int
    when: manages_tax(book) && tax_method(book) == 'simplified'
    description:
      en: Confirmed default business class for simplified taxable sales; individual lines may override it.
      ja: 簡易課税の課税売上に使う確認済みの既定の事業区分です。明細ごとに変更できます。
    enum: [{value: 1}, {value: 2}, {value: 3}, {value: 4}, {value: 5}, {value: 6}]
