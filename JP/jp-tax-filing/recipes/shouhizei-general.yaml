# 消費税 return figures — 本則課税 (general method).
#
# The engine's exact sums over every posted line with a tax block,
# combined the way the 申告書 needs them: 割戻し computation on the
# aggregate per rate, the invoice / non-invoice split, the 百円未満切捨て
# on the amount payable. The 経過措置 percentage for purchases without a
# qualifying invoice follows the date of each purchase
# (non_invoice_periods in functions.yaml), so a period that straddles a
# change — a calendar-2026 return, say — is split at the change.
#
# Assumes full deduction of purchase tax (課税売上割合 ≥ 95% and
# taxable sales ≤ ¥500M); the figures include the 課税売上割合 so the LLM
# can tell when 個別対応 / 一括比例配分 applies instead. Also assumes no
# single non-invoice seller passes the 経過措置's annual cap (¥100M per
# seller from periods starting 2026-10-01, ¥1bn before). The 国税 /
# 地方税 split and the 千円未満切捨て of the 課税標準額 are form arithmetic
# the LLM applies on the figures.
id: shouhizei-general
output: figures
description:
  en: >-
    Generate supporting Japanese consumption-tax figures under general taxation:
    sales and purchases by rate (recorded amounts and tax), export, exempt and
    out-of-scope totals, taxable sales ratio, deductible input tax with dated
    non-invoice transitions, and the reference balance rounded down to JPY 100.
    Read jp-tax-filing.filing for coverage before confirming scope. Preview
    returns a calculation aid, not a completed return. Save with provenance under
    filings/ only with CLI --apply --out PATH or MCP run_recipe with apply=true and out=PATH.
  ja: "本則課税の消費税計算を補助します。税率別の売上・仕入（記帳額と税額）、免税・非課税・不課税の合計、課税売上割合、仕入日別の経過措置を含む仕入税額控除と、差引税額の参考額（100円未満切捨て）を計算します。jp-tax-filing.filing で対応範囲を確認してください。出力は計算補助資料であり、完成した申告書ではありません。CLI で --apply --out PATH を指定するか、MCP の run_recipe に apply=true と out=保存先を指定した場合だけ、filings/ に計算条件とともに記録します。"
params:
  - {name: scope_confirmed, type: bool, enum: [true], doc: "Confirm the exact calculation coverage and exclusions in jp-tax-filing.filing before invoking; these figures are not a completed return."}
  - {name: from, type: string, doc: "Period start, YYYY-MM-DD (課税期間: calendar year for individuals, the fiscal year for a 法人)"}
  - {name: to, type: string, doc: "Period end, YYYY-MM-DD"}
let:
  incl: tax_accounting(book) != 'tax_excluded'
  by_rate: sums(journals, ['tax.category', 'tax.rate'], date(from), date(to))
  by_invoice: sums(journals, ['tax.category', 'tax.rate', 'tax.invoice'], date(from), date(to))
  sales_10: bucket_credit(by_rate, ['taxable_sale', '10']) - bucket_debit(by_rate, ['taxable_sale', '10'])
  sales_8: >-
    bucket_credit(by_rate, ['taxable_sale', '8r']) - bucket_debit(by_rate, ['taxable_sale', '8r'])
    + bucket_credit(by_rate, ['taxable_sale', '8o']) - bucket_debit(by_rate, ['taxable_sale', '8o'])
  purch_10_inv: bucket_debit(by_invoice, ['taxable_purchase', '10', 'true']) - bucket_credit(by_invoice, ['taxable_purchase', '10', 'true'])
  purch_10_noinv: bucket_debit(by_invoice, ['taxable_purchase', '10', '']) - bucket_credit(by_invoice, ['taxable_purchase', '10', '']) + bucket_debit(by_invoice, ['taxable_purchase', '10', 'false']) - bucket_credit(by_invoice, ['taxable_purchase', '10', 'false'])
  purch_8_inv: >-
    bucket_debit(by_invoice, ['taxable_purchase', '8r', 'true']) - bucket_credit(by_invoice, ['taxable_purchase', '8r', 'true'])
    + bucket_debit(by_invoice, ['taxable_purchase', '8o', 'true']) - bucket_credit(by_invoice, ['taxable_purchase', '8o', 'true'])
  purch_8_noinv: >-
    bucket_debit(by_invoice, ['taxable_purchase', '8r', '']) - bucket_credit(by_invoice, ['taxable_purchase', '8r', ''])
    + bucket_debit(by_invoice, ['taxable_purchase', '8r', 'false']) - bucket_credit(by_invoice, ['taxable_purchase', '8r', 'false'])
    + bucket_debit(by_invoice, ['taxable_purchase', '8o', '']) - bucket_credit(by_invoice, ['taxable_purchase', '8o', ''])
    + bucket_debit(by_invoice, ['taxable_purchase', '8o', 'false']) - bucket_credit(by_invoice, ['taxable_purchase', '8o', 'false'])
  export_sales: bucket_credit(by_rate, ['export_sale', '0']) + bucket_credit(by_rate, ['export_sale', '']) - bucket_debit(by_rate, ['export_sale', '0']) - bucket_debit(by_rate, ['export_sale', ''])
  exempt_sales: bucket_credit(by_rate, ['exempt_sale', '']) - bucket_debit(by_rate, ['exempt_sale', ''])
  securities_sales: bucket_credit(by_rate, ['securities_sale', '']) - bucket_debit(by_rate, ['securities_sale', ''])
  sales_tax_10: tax_of(sales_10, 10, incl)
  sales_tax_8: tax_of(sales_8, 8, incl)
  sales_tax: sales_tax_10 + sales_tax_8
  purchase_tax_invoice: tax_of(purch_10_inv, 10, incl) + tax_of(purch_8_inv, 8, incl)
  # One entry per 経過措置 period the return covers, clipped to [from, to].
  non_invoice_spans: >-
    non_invoice_periods()
      .filter(p, p.from <= to && p.to >= from)
      .map(p, {'from': p.from > from ? p.from : from, 'to': p.to < to ? p.to : to, 'pct': p.pct})
  non_invoice_sums: >-
    non_invoice_spans.map(p, {'from': p.from, 'to': p.to, 'pct': p.pct,
      's': sums(journals, ['tax.category', 'tax.rate', 'tax.invoice'], date(p.from), date(p.to))})
  non_invoice_purchases_by_period: >-
    non_invoice_sums.map(p, {'from': p.from, 'to': p.to, 'pct': p.pct,
      'purchases_10': non_invoice_purchases(p.s, '10'),
      'purchases_8': non_invoice_purchases(p.s, '8r') + non_invoice_purchases(p.s, '8o')})
  non_invoice_by_period: >-
    non_invoice_purchases_by_period.map(p, {'from': p.from, 'to': p.to, 'pct': p.pct,
      'purchases_10': p.purchases_10, 'purchases_8': p.purchases_8,
      'deductible_tax': (tax_of(p.purchases_10, 10, incl) + tax_of(p.purchases_8, 8, incl)) * p.pct / 100})
  purchase_tax_non_invoice: sum(non_invoice_by_period.map(p, p.deductible_tax))
  deductible_tax: purchase_tax_invoice + purchase_tax_non_invoice
  net_tax: sales_tax - deductible_tax
  taxable_sales_total: sales_10 + sales_8 + export_sales
  all_sales_total: taxable_sales_total + exempt_sales + securities_sales / 20
result: >-
  {
    'period_from': from, 'period_to': to,
    'accounting': incl ? 'tax_included' : 'tax_excluded',
    'sales_10': sales_10, 'sales_tax_10': sales_tax_10,
    'sales_8': sales_8, 'sales_tax_8': sales_tax_8,
    'export_sales': export_sales, 'exempt_sales': exempt_sales, 'securities_sales': securities_sales,
    'purchases_10_invoice': purch_10_inv, 'purchases_10_non_invoice': purch_10_noinv,
    'purchases_8_invoice': purch_8_inv, 'purchases_8_non_invoice': purch_8_noinv,
    'taxable_sales_ratio_bp': all_sales_total == 0 ? 0 : taxable_sales_total * 10000 / all_sales_total,
    'sales_tax': sales_tax,
    'purchase_tax_invoice': purchase_tax_invoice,
    'purchase_tax_non_invoice': purchase_tax_non_invoice,
    'non_invoice_by_period': non_invoice_by_period,
    'deductible_tax': deductible_tax,
    'net_tax': net_tax,
    'payable': net_tax >= 0 ? floor_to(net_tax, 100) : net_tax
  }
