tasks:
  - id: jp-small-asset-deduction.equipment
    title: Check small-asset deduction
    summary: Inspect the recorded deduction method, required asset fields, acquisition-date limits and annual Book-wide cap.
    target: asset
    fields: [asset.name, asset.acquisition_date, asset.acquisition_cost, asset.method, asset.useful_life_months, asset.salvage_value, asset.asset_account, asset.depreciation_expense_account, asset.accumulated_depreciation_account, asset.acquisition_journal, asset.toku_rei, asset.jp_deduction_confirmed]
    rules: [asset.toku-rei-unknown, asset.ikkatsu-unsupported, asset.regime-method, asset.regime-scope, asset.shoutoku-expired, asset.shoutoku-cost-max, asset.shoutoku-cost-min, asset.shoutoku-cap-exceeded]
    operations: [{kind: core, id: asset.schedule}]
    guide: jp-small-asset-deduction.equipment
    examples: ["tests/equipment.yaml#expensed-valid", "tests/equipment.yaml#deduction boundary", "tests/equipment.yaml#pooled schedule refused"]
    coverage: [Required asset fields, acquisition-date small-business limits and annual deduction cap checks across the Book.]
    judgment: [Confirm service date, evidence, taxpayer eligibility, amount basis and method. Short fiscal years, deferred service, pooled depreciation and partial-year declining-balance schedules are unsupported. Core allocation is a separate explicit operation.]
