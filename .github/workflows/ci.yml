name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    name: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/check-versions.sh

  golden:
    name: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Download and verify iris
        run: .github/scripts/fetch-iris.sh
      - name: Run every overlay's golden tests
        run: |
          # `overlay test --dir` first ships in iris v0.2.0; until that is the
          # latest release this step can only say so.
          if ! iris overlay test -h 2>&1 | grep -q 'overlay-dir'; then
            echo "::warning::iris $(cat "$RUNNER_TEMP/iris/version.txt") predates 'iris overlay test --dir' (v0.2.0) — golden tests not run"
            exit 0
          fi
          status=0
          for manifest in */overlay.yaml; do
            id="${manifest%/overlay.yaml}"
            echo "::group::$id"
            iris overlay test --dir "$id" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
