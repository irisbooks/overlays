name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    name: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check package requirements against the published-engine pin
        run: python3 .github/scripts/check-engine.py
      - run: .github/scripts/check-versions.sh

  golden:
    name: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Published-engine policy regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Download and verify the pinned iris
        run: .github/scripts/fetch-iris.sh
      - name: Run every overlay's golden tests
        run: .github/scripts/run-goldens.sh
      - name: Compare RSU valuation with exact rational arithmetic
        run: python3 .github/scripts/check-rsu-valuation.py

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
